name: Immagine microSD

on:
  workflow_dispatch:
    inputs:
      pi_password:
        description: "Password dell'utente pi (va cambiata al primo accesso)"
        default: "raspberry"
      enable_ssh:
        description: "SSH attivo (1/0)"
        default: "1"
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-flask python3-requests
          python3 tests/test_all.py

      - name: Strumenti per l'immagine
        run: |
          sudo apt-get install -y qemu-user-static binfmt-support parted e2fsprogs dosfstools xz-utils curl
          sudo update-binfmts --enable qemu-aarch64 || true
          ls /proc/sys/fs/binfmt_misc/

      - name: Crea l'immagine
        env:
          PI_PASSWORD: ${{ github.event.inputs.pi_password || 'raspberry' }}
          ENABLE_SSH: ${{ github.event.inputs.enable_ssh || '1' }}
        run: sudo -E ./image/build-image.sh

      - name: Pubblica come artifact
        uses: actions/upload-artifact@v4
        with:
          name: onvif-viewer-pi
          path: |
            image/onvif-viewer-pi.img.xz
            image/onvif-viewer-pi.img.xz.sha256
          compression-level: 0

      - name: Release (solo per i tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            image/onvif-viewer-pi.img.xz
            image/onvif-viewer-pi.img.xz.sha256
